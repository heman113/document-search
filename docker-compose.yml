services: 
  postgres:
    image: pgvector/pgvector:pg17
    container_name: document-search-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: Heman12345
      POSTGRES_DB: document_search
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d document_search"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes: 
  postgres_data: